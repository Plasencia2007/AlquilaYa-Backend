# Producción — todos los servicios containerizados, sin ngrok, con nginx.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  # ===================== Infraestructura =====================

  postgres:
    image: postgres:15
    container_name: alquilaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alquilaya-prod-network

  mysql:
    image: mysql:8.0
    container_name: alquilaya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: alquilaya_catalogos
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alquilaya-prod-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: alquilaya-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - alquilaya-prod-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: alquilaya-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - alquilaya-prod-network

  # ===================== Spring Cloud =====================

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: alquilaya-discovery
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alquilaya-prod-network

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: alquilaya-config
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      HIBERNATE_DDL_AUTO: validate
      SHOW_SQL: "false"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL}
      MP_BACK_URL_SUCCESS: ${MP_BACK_URL_SUCCESS}
      MP_BACK_URL_FAILURE: ${MP_BACK_URL_FAILURE}
      MP_BACK_URL_PENDING: ${MP_BACK_URL_PENDING}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NOTIFICATION_SERVICE_URL: http://servicio-notificaciones:8081
      APP_BASE_URL: ${APP_BASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alquilaya-prod-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: alquilaya-gateway
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - alquilaya-prod-network

  servicio-usuarios:
    build:
      context: ./servicio-usuarios
      dockerfile: Dockerfile
    container_name: alquilaya-usuarios
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - alquilaya-prod-network

  servicio-propiedades:
    build:
      context: ./servicio-propiedades
      dockerfile: Dockerfile
    container_name: alquilaya-propiedades
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - alquilaya-prod-network

  servicio-pagos:
    build:
      context: ./servicio-pagos
      dockerfile: Dockerfile
    container_name: alquilaya-pagos
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - alquilaya-prod-network

  servicio-catalogos:
    build:
      context: ./servicio-catalogos
      dockerfile: Dockerfile
    container_name: alquilaya-catalogos
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - alquilaya-prod-network

  servicio-mensajeria:
    build:
      context: ./servicio-mensajeria
      dockerfile: Dockerfile
    container_name: alquilaya-mensajeria
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - alquilaya-prod-network

  servicio-notificaciones:
    build:
      context: ./servicio-notificaciones
      dockerfile: Dockerfile
    container_name: alquilaya-notificaciones
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PORT: 8081
    volumes:
      - whatsapp_auth:/home/app/.wwebjs_auth
    networks:
      - alquilaya-prod-network

  # ===================== Frontend =====================

  frontend:
    build:
      context: ./AlquilaYa-Fronted
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_BASE_URL}/api/v1
        NEXT_PUBLIC_WS_URL: ${WS_URL}
    container_name: alquilaya-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://api-gateway:8080
    networks:
      - alquilaya-prod-network

  # ===================== Nginx =====================

  nginx:
    image: nginx:1.27-alpine
    container_name: alquilaya-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-gateway
      - servicio-mensajeria
    networks:
      - alquilaya-prod-network

volumes:
  postgres_data:
  mysql_data:
  whatsapp_auth:

networks:
  alquilaya-prod-network:
    name: alquilaya-prod-network
