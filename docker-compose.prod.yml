# Producción — todos los servicios containerizados, sin ngrok, con nginx.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  # ===================== Infraestructura =====================

  postgres:
    image: postgres:15
    container_name: alquilaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alquilaya-prod-network

  mysql:
    image: mysql:8.0
    container_name: alquilaya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: alquilaya_catalogos
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alquilaya-prod-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: alquilaya-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - alquilaya-prod-network

  redis:
    image: redis:7.4-alpine
    container_name: alquilaya-redis
    restart: unless-stopped
    # En prod NO exponemos el puerto al host; solo accesible desde la red interna del compose.
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - alquilaya-prod-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: alquilaya-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - alquilaya-prod-network

  # ===================== Spring Cloud =====================

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: alquilaya-discovery
    mem_limit: 512m
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alquilaya-prod-network

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: alquilaya-config
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_RESOLVE_PLACEHOLDERS: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Primer admin en un despliegue nuevo (se siembra solo si la BD no tiene ningún ADMIN).
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      HIBERNATE_DDL_AUTO: validate
      # Flyway ON en prod: cada servicio aplica sus migraciones V1__baseline (+ V2+ en usuarios)
      # sobre la BD nueva antes de que Hibernate valide el esquema. Sin esto, `validate` falla
      # en el primer deploy porque init.sql solo crea las BD vacías.
      FLYWAY_ENABLED: "true"
      SHOW_SQL: "false"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      # Firma del webhook: default true (validar). En sandbox con secret vacío, el .env lo pone en false.
      MP_WEBHOOK_REQUIRED_SIGNATURE: ${MP_WEBHOOK_REQUIRED_SIGNATURE:-true}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL}
      MP_BACK_URL_SUCCESS: ${MP_BACK_URL_SUCCESS}
      MP_BACK_URL_FAILURE: ${MP_BACK_URL_FAILURE}
      MP_BACK_URL_PENDING: ${MP_BACK_URL_PENDING}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      # Token de ApiPeru (verificación de DNI). Sin esto, la verificación de DNI falla en prod.
      APIPERU_TOKEN: ${APIPERU_TOKEN:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NOTIFICATION_SERVICE_URL: http://servicio-notificaciones:8081
      APP_BASE_URL: ${APP_BASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alquilaya-prod-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: alquilaya-gateway
    mem_limit: 768m
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # S8: 1 proxy de confianza delante del gateway (nginx). ngrok→nginx→gateway.
      # Verificar con logs reales que la IP resuelta es la del cliente; ajustar si la cadena cambia.
      RATE_LIMIT_TRUSTED_HOPS: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - alquilaya-prod-network

  servicio-usuarios:
    build:
      context: ./servicio-usuarios
      dockerfile: Dockerfile
    container_name: alquilaya-usuarios
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # S8: 2 proxies delante de usuarios (nginx + gateway anexan XFF). ngrok→nginx→gateway→usuarios.
      RATE_LIMIT_TRUSTED_HOPS: "2"
    networks:
      - alquilaya-prod-network

  servicio-propiedades:
    build:
      context: ./servicio-propiedades
      dockerfile: Dockerfile
    container_name: alquilaya-propiedades
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - alquilaya-prod-network

  servicio-pagos:
    build:
      context: ./servicio-pagos
      dockerfile: Dockerfile
    container_name: alquilaya-pagos
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      # Perfil prod: excluye el DevOnlyPagoController (endpoint /pagos/simular-exito, @Profile("!prod")).
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - alquilaya-prod-network

  servicio-catalogos:
    build:
      context: ./servicio-catalogos
      dockerfile: Dockerfile
    container_name: alquilaya-catalogos
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - alquilaya-prod-network

  servicio-mensajeria:
    build:
      context: ./servicio-mensajeria
      dockerfile: Dockerfile
    container_name: alquilaya-mensajeria
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - alquilaya-prod-network

  servicio-notificaciones:
    build:
      context: ./servicio-notificaciones
      dockerfile: Dockerfile
    container_name: alquilaya-notificaciones
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PORT: 8081
      # La sesión de WhatsApp se guarda en el volumen montado → no se re-escanea el QR (I6).
      WWEBJS_DATA_PATH: /home/app/.wwebjs_auth
    volumes:
      - whatsapp_auth:/home/app/.wwebjs_auth
    networks:
      - alquilaya-prod-network

  # ===================== Frontend =====================

  frontend:
    build:
      context: ./AlquilaYa-Fronted
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/v1
        NEXT_PUBLIC_WS_URL: ${WS_URL}
    container_name: alquilaya-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://api-gateway:8080
    networks:
      - alquilaya-prod-network

  # ===================== Nginx =====================

  nginx:
    image: nginx:1.27-alpine
    container_name: alquilaya-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-gateway
      - servicio-mensajeria
    networks:
      - alquilaya-prod-network

  # ===================== ngrok (demo de producción) =====================
  # Expone TODA la app (nginx :80 → web + API + WebSocket) por un link HTTPS; ngrok pone el TLS.
  # Con esto, abrir https://${NGROK_DOMAIN} sirve la app completa (chat incluido, gracias a F1).
  # ⚠️ Al pasar a un VPS con dominio real: ELIMINA este servicio y activa TLS en nginx (S6).
  ngrok:
    image: ngrok/ngrok:3
    container_name: alquilaya-ngrok
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN no configurado en .env}
    command: http nginx:80 --url=${NGROK_DOMAIN}
    networks:
      - alquilaya-prod-network

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  whatsapp_auth:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  alquilaya-prod-network:
    name: alquilaya-prod-network
