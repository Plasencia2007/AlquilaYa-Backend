worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm image/svg+xml;

    # Brotli (ítem 440 de MEJORAS.md): NO implementado a propósito. La imagen base
    # nginx:1.27-alpine no trae el módulo brotli (ni estático ni dinámico, ni el paquete
    # `ngx_brotli`); agregarlo exige compilar nginx con ese módulo o cambiar de imagen base
    # (ej. openresty/openresty o un build custom), lo que es un cambio de infraestructura
    # más grande que este ítem del roadmap — se deja documentado en vez de implementarse
    # sin coordinación explícita. gzip cubre la compresión en el edge por ahora.

    server {
        listen 80;
        server_name _;

        # Assets estáticos de Next.js (ítem 440): nombres con hash de contenido
        # (/_next/static/**), inmutables por convención → cache agresivo de 1 año.
        # Va antes de `location /` por legibilidad; nginx igual la elegiría primero por
        # ser el prefijo más largo/específico entre las dos (matching por especificidad,
        # no por orden de declaración, para location prefijo sin regex).
        location /_next/static/ {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # API REST → api-gateway
        location /api/ {
            proxy_pass         http://api-gateway:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # >= al timeLimiter más largo del gateway (propiedadesCB: 90s) para que
            # su FallbackController tenga oportunidad de responder antes de que
            # nginx corte la conexión con un 504 crudo.
            proxy_read_timeout 95s;
        }

        # WebSocket STOMP directo → servicio-mensajeria
        location /ws-mensajeria {
            proxy_pass         http://servicio-mensajeria:8086;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Frontend Next.js
        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
