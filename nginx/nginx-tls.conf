# =============================================================================
# nginx-tls.conf — Variante con TLS para el VPS real (S6).
#
# NO se usa con ngrok (ngrok ya termina TLS y reenvía a nginx:80 → usa nginx.conf).
# Actívala SÓLO cuando tengas un dominio real + certificados (Let's Encrypt):
#   1. Apunta tu dominio (A record) al VPS.
#   2. Obtén certificados (ver nginx/README-TLS.md → certbot).
#   3. En docker-compose.prod.yml, monta este archivo en vez de nginx.conf:
#        - ./nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro
#      y monta los certificados:
#        - /etc/letsencrypt:/etc/letsencrypt:ro
#      y publica el puerto 443 además del 80.
#   4. Reemplaza  TU_DOMINIO.com  por tu dominio real (2 sitios abajo).
#
# `nginx -t` valida la sintaxis; sin los certificados en disco, nginx NO arranca
# (por eso es un archivo aparte y no el default).
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --- HTTP :80 → redirige todo a HTTPS (salvo el reto ACME de Let's Encrypt) ---
    server {
        listen 80;
        server_name TU_DOMINIO.com;

        # Renovación de certificados (webroot de certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS :443 ---
    server {
        listen 443 ssl;
        http2 on;
        server_name TU_DOMINIO.com;

        ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;

        # TLS moderno (Mozilla "intermediate")
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS: fuerza HTTPS en el navegador por 1 año (activar sólo cuando TLS ya funciona)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API REST → api-gateway
        location /api/ {
            proxy_pass         http://api-gateway:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # WebSocket STOMP directo → servicio-mensajeria (wss://)
        location /ws-mensajeria {
            proxy_pass         http://servicio-mensajeria:8086;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Frontend Next.js
        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
