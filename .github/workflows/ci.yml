name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: tests de los módulos Maven ──────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: mvn test --batch-mode -Dspring.profiles.active=test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
          JWT_SECRET: test-secret-at-least-256-bits-long-for-testing-purposes-only
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  # ── Frontend: build + TypeScript check ──────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AlquilaYa-Fronted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AlquilaYa-Fronted/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript check + bundle)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8086/ws-mensajeria
          NEXT_PUBLIC_UPLOADS_URL: http://localhost:8080/uploads
          NEXT_TELEMETRY_DISABLED: 1

  # ── Docker: build de imágenes (solo en main) ─────────────────────────────────
  docker-build:
    name: Docker Build
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push discovery-server
        uses: docker/build-push-action@v5
        with:
          context: ./discovery-server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-discovery:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push config-server
        uses: docker/build-push-action@v5
        with:
          context: ./config-server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-config:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push servicio-usuarios
        uses: docker/build-push-action@v5
        with:
          context: ./servicio-usuarios
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-usuarios:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push servicio-propiedades
        uses: docker/build-push-action@v5
        with:
          context: ./servicio-propiedades
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-propiedades:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push servicio-pagos
        uses: docker/build-push-action@v5
        with:
          context: ./servicio-pagos
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-pagos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push servicio-catalogos
        uses: docker/build-push-action@v5
        with:
          context: ./servicio-catalogos
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-catalogos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push servicio-mensajeria
        uses: docker/build-push-action@v5
        with:
          context: ./servicio-mensajeria
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-mensajeria:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push servicio-notificaciones
        uses: docker/build-push-action@v5
        with:
          context: ./servicio-notificaciones
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-notificaciones:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./AlquilaYa-Fronted
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/alquilaya-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.APP_BASE_URL }}/api/v1
            NEXT_PUBLIC_WS_URL=${{ secrets.WS_URL }}
            NEXT_PUBLIC_UPLOADS_URL=${{ secrets.APP_BASE_URL }}/uploads
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: SSH al servidor (manual, solo en main) ───────────────────────────
  deploy:
    name: Deploy to Production
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/alquilaya
            git pull origin main
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker image prune -f
