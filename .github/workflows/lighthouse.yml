name: Lighthouse CI

# Ítem 432 de MEJORAS.md: performance/accesibilidad de las rutas públicas del
# frontend. Workflow NUEVO y separado de ci.yml a propósito (no lo toca).
# Sólo corre en PRs que tocan el frontend (paths:) — un cambio de backend no
# necesita re-auditar Lighthouse.
on:
  pull_request:
    paths:
      - 'AlquilaYa-Fronted/**'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AlquilaYa-Fronted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AlquilaYa-Fronted/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8086/ws-mensajeria
          NEXT_PUBLIC_UPLOADS_URL: http://localhost:8080/uploads
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start server in background
        run: |
          nohup npm run start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server up (intento $i)"
              exit 0
            fi
            sleep 2
          done
          echo "El server no respondió a tiempo, log de next start:"
          cat /tmp/next-start.log
          exit 1

      - name: Run Lighthouse CI
        run: npx lhci autorun
        # `lighthouserc.js` (raíz de AlquilaYa-Fronted) apunta a las URLs de
        # http://localhost:3000 ya arriba — ver ese archivo para los
        # thresholds de performance/accesibilidad y el presupuesto de bundle.
