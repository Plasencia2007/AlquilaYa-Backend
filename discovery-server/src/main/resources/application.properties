spring.application.name=discovery-server
server.port=8761

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Basic Auth: sin esto, /eureka/apps expone sin credenciales la topologia completa
# (instancias, IPs, puertos, metadata) de todo el sistema. /actuator/health queda
# abierto (SecurityConfig) para no romper el healthcheck de docker-compose. Los
# demas servicios se autentican embebiendo las credenciales en
# eureka.client.serviceUrl.defaultZone (http://user:pass@host:8761/eureka/), que
# es el mecanismo estandar de Spring Cloud Netflix para esto.
eureka.dashboard.enabled=true
spring.security.user.name=${EUREKA_USERNAME:eureka-admin}
spring.security.user.password=${EUREKA_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
