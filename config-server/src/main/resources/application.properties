spring.application.name=config-server
server.port=8888

# Perfil nativo para leer de src/main/resources/config
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config

# Registro en Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

# Resolver placeholders en el servidor antes de entregar configuración
spring.cloud.config.server.resolve-placeholders=true

# Basic Auth: sin esto, cualquiera en la red alcanza /servicio-*/default y lee
# TODOS los secretos reales ya resueltos (JWT_SECRET, passwords de BD, tokens
# de MercadoPago/Cloudinary...). /actuator/health queda abierto (SecurityConfig)
# para no romper el healthcheck de docker-compose.
spring.security.user.name=${CONFIG_SERVER_USERNAME:config-admin}
spring.security.user.password=${CONFIG_SERVER_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
