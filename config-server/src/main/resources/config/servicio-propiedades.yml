# Configuración para el Servicio de Propiedades
spring:
  application:
    name: servicio-propiedades
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB_PROPIEDADES:alquilaya_propiedades}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  kafka:
    template:
      default-topic: propiedades-topic
    consumer:
      # Ola 2: este servicio consume pagos-topic; arrancamos desde el principio
      # para no perder eventos en el primer arranque tras la migración.
      # La idempotencia (processed_events) protege contra reprocesamiento.
      auto-offset-reset: earliest
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082

# Configuración de Cloudinary (Fase 3 - Real)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:ddiyaoxkt}
  api-key: ${CLOUDINARY_API_KEY:387589685746197}
  api-secret: ${CLOUDINARY_API_SECRET:PLACEHOLDER_SET_ENV_VAR}

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      servicio-usuarios:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10
      obtenerArrendadorCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      obtenerEstudianteCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      verificarPermisoCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      obtenerArrendadorCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - feign.FeignException.NotFound
      obtenerEstudianteCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - feign.FeignException.NotFound
      verificarPermisoCB:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      servicio-usuarios:
        timeoutDuration: 10s
        cancelRunningFuture: true
      obtenerArrendadorCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
      obtenerEstudianteCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
      verificarPermisoCB:
        timeoutDuration: 3s
        cancelRunningFuture: true
  bulkhead:
    instances:
      obtenerArrendadorCB:
        maxConcurrentCalls: 5  # Máximo 5 llamadas simultáneas a este servicio
        maxWaitDuration: 100ms # Si hay más de 5, espera 100ms; si no hay slot, rechaza con HTTP 429
      obtenerEstudianteCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms
      verificarPermisoCB:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms

# Sincronización de Seguridad con Usuarios
jwt:
  # Sin default real: el secreto se inyecta por env (.env en dev, .env.prod en prod). Nunca en git.
  secret: ${JWT_SECRET:PLACEHOLDER_SET_ENV_VAR}
  expiration: ${JWT_EXPIRATION:7200000}

# Reglas de negocio de reservas
app:
  reserva:
    # Horas que una reserva APROBADA espera el pago antes de pasar a EXPIRADA
    # (libera el cuarto automáticamente). Configurable sin recompilar.
    expiracion-horas: ${RESERVA_EXPIRACION_HORAS:24}
    # Cron del job que expira reservas sin pago. Default: cada hora en punto.
    expiracion-cron: ${RESERVA_EXPIRACION_CRON:0 0 */1 * * *}
    # Cron del job que finaliza reservas PAGADA con estadía vencida
    # (PAGADA -> FINALIZADA, habilita reseñas). Default: diario a las 00:30.
    finalizacion-cron: ${RESERVA_FINALIZACION_CRON:0 30 0 * * *}
    # Recordatorio de pago antes de expirar: se avisa al consumir esta fracción
    # del plazo (0.5 = a mitad del tiempo). Entre 0 y 1.
    recordatorio-fraccion: ${RESERVA_RECORDATORIO_FRACCION:0.5}
    # Cron del job de recordatorios. Default: cada 30 minutos.
    recordatorio-cron: ${RESERVA_RECORDATORIO_CRON:0 */30 * * * *}
