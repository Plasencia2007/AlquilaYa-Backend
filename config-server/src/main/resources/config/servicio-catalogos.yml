spring:
  application:
    name: servicio-catalogos
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB_CATALOGOS:alquilaya_catalogos}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  # Límite de subida multipart: la imagen del banner del hero se valida a 5MB en el
  # controlador; dejamos 6MB en la capa de transporte para que sea el chequeo de negocio
  # (mensaje claro) el que rechace, y no un MaxUploadSizeExceededException genérico.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8085

# Configuración de Cloudinary: subida de la imagen del banner del hero (uploader del admin).
# Mismas credenciales que servicio-propiedades; se inyectan por env (.env en dev/prod).
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:PLACEHOLDER_SET_ENV_VAR}
  api-key: ${CLOUDINARY_API_KEY:PLACEHOLDER_SET_ENV_VAR}
  api-secret: ${CLOUDINARY_API_SECRET:PLACEHOLDER_SET_ENV_VAR}

jwt:
  # Sin default real: el secreto se inyecta por env (.env en dev, .env.prod en prod). Nunca en git.
  secret: ${JWT_SECRET:PLACEHOLDER_SET_ENV_VAR}
  expiration: ${JWT_EXPIRATION:7200000}

# Secreto compartido entre servicios internos (mismo valor que usa el servicio Node de
# notificaciones). Protege el endpoint interno de zonas /zonas/activas/interno, que sí expone la
# comisión de plataforma. Se inyecta por env (.env en dev, .env.prod en prod). Nunca en git.
internal:
  api-key: ${INTERNAL_API_KEY:PLACEHOLDER_SET_ENV_VAR}
