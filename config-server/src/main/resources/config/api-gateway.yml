spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: servicio-usuarios
            uri: lb://servicio-usuarios
            predicates:
              - Path=/api/v1/usuarios/**, /api/v1/auth/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  name: usuariosCB
                  fallbackUri: forward:/fallback/usuarios
          - id: servicio-propiedades
            uri: lb://servicio-propiedades
            predicates:
              - Path=/api/v1/propiedades/**, /api/v1/admin/propiedades/**, /api/v1/reservas/**, /api/v1/favoritos/**, /api/v1/resenas/**, /api/v1/dashboard/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  name: propiedadesCB
                  fallbackUri: forward:/fallback/propiedades
          - id: servicio-catalogos
            uri: lb://servicio-catalogos
            predicates:
              - Path=/api/v1/catalogos/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  name: catalogosCB
                  fallbackUri: forward:/fallback/catalogos
          - id: servicio-pagos
            uri: lb://servicio-pagos
            predicates:
              - Path=/api/v1/pagos/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  name: pagosCB
                  fallbackUri: forward:/fallback/pagos
          - id: servicio-mensajeria
            uri: lb://servicio-mensajeria
            predicates:
              - Path=/api/v1/mensajeria/**, /api/v1/admin/mensajeria/**, /api/v1/notificaciones/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  name: mensajeriaCB
                  fallbackUri: forward:/fallback/mensajeria
          # NOTA: WebSocket /ws-mensajeria NO se rutea por este gateway (Spring Cloud Gateway MVC
          # no soporta proxy WS). El frontend conecta directo al servicio en :8086.

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
