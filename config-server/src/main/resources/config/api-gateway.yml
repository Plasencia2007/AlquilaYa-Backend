spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: servicio-usuarios
            uri: lb://servicio-usuarios
            predicates:
              - Path=/api/v1/usuarios/**, /api/v1/auth/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  id: usuariosCB
                  fallbackUri: forward:/fallback/usuarios
          - id: servicio-propiedades
            uri: lb://servicio-propiedades
            predicates:
              - Path=/api/v1/propiedades/**, /api/v1/admin/propiedades/**, /api/v1/admin/denuncias/**, /api/v1/reservas/**, /api/v1/favoritos/**, /api/v1/resenas/**, /api/v1/dashboard/**, /api/v1/grupos/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  id: propiedadesCB
                  fallbackUri: forward:/fallback/propiedades
          - id: servicio-catalogos
            uri: lb://servicio-catalogos
            predicates:
              - Path=/api/v1/catalogos/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  id: catalogosCB
                  fallbackUri: forward:/fallback/catalogos
          - id: servicio-pagos
            uri: lb://servicio-pagos
            predicates:
              - Path=/api/v1/pagos/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  id: pagosCB
                  fallbackUri: forward:/fallback/pagos
          - id: servicio-mensajeria
            uri: lb://servicio-mensajeria
            predicates:
              - Path=/api/v1/mensajeria/**, /api/v1/admin/mensajeria/**, /api/v1/notificaciones/**
            filters:
              - StripPrefix=0
              - name: CircuitBreaker
                args:
                  id: mensajeriaCB
                  fallbackUri: forward:/fallback/mensajeria
          # --- Swagger agregado: proxy a los /v3/api-docs de cada servicio (vía Eureka) ---
          - id: openapi-usuarios
            uri: lb://servicio-usuarios
            predicates:
              - Path=/v3/api-docs/usuarios
            filters:
              - RewritePath=/v3/api-docs/usuarios, /v3/api-docs
          - id: openapi-propiedades
            uri: lb://servicio-propiedades
            predicates:
              - Path=/v3/api-docs/propiedades
            filters:
              - RewritePath=/v3/api-docs/propiedades, /v3/api-docs
          - id: openapi-pagos
            uri: lb://servicio-pagos
            predicates:
              - Path=/v3/api-docs/pagos
            filters:
              - RewritePath=/v3/api-docs/pagos, /v3/api-docs
          - id: openapi-catalogos
            uri: lb://servicio-catalogos
            predicates:
              - Path=/v3/api-docs/catalogos
            filters:
              - RewritePath=/v3/api-docs/catalogos, /v3/api-docs
          - id: openapi-mensajeria
            uri: lb://servicio-mensajeria
            predicates:
              - Path=/v3/api-docs/mensajeria
            filters:
              - RewritePath=/v3/api-docs/mensajeria, /v3/api-docs
          # NOTA: WebSocket /ws-mensajeria NO se rutea por este gateway (Spring Cloud Gateway MVC
          # no soporta proxy WS). El frontend conecta directo al servicio en :8086.

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
        cancelRunningFuture: true
    instances:
      propiedadesCB:
        timeoutDuration: 90s
        cancelRunningFuture: false
      pagosCB:
        timeoutDuration: 30s
        cancelRunningFuture: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Rate limit (S8): nº de proxies de confianza delante del gateway que anexan a X-Forwarded-For.
# dev (sin proxy) = 0 → usa la IP del socket (no falsificable).
# prod (ngrok→nginx→gateway) = 1 → se fija en docker-compose.prod.yml (RATE_LIMIT_TRUSTED_HOPS).
rate-limit:
  trusted-hops: ${RATE_LIMIT_TRUSTED_HOPS:0}

# Swagger UI agregado en el gateway: una sola UI con un dropdown para los 5 microservicios.
# Accesible en  http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: servicio-usuarios
        url: /v3/api-docs/usuarios
      - name: servicio-propiedades
        url: /v3/api-docs/propiedades
      - name: servicio-pagos
        url: /v3/api-docs/pagos
      - name: servicio-catalogos
        url: /v3/api-docs/catalogos
      - name: servicio-mensajeria
        url: /v3/api-docs/mensajeria
