spring:
  application:
    name: servicio-mensajeria
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB_MENSAJERIA:alquilaya_mensajeria}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  kafka:
    template:
      default-topic: mensajeria-topic
    consumer:
      # Ola 2: consumer puro (reserva-events, pagos-topic, user-approval-events).
      # Earliest para no perder eventos previos al arranque; idempotencia (processed_events)
      # filtra duplicados en caso de reprocesamiento.
      auto-offset-reset: earliest
  servlet:
    multipart:
      # Ítem 254: adjuntos de chat (imágenes). El límite de negocio real (10MB, con
      # mensaje de error amigable) lo aplica CloudinaryService.validar(); este tope de
      # Spring se deja un poco más alto para que ESA validación sea la que dispare
      # primero en el caso límite, en vez del MaxUploadSizeExceededException genérico.
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: 8086

# Configuración de Cloudinary (ítem 254: imágenes adjuntas en el chat). Mismas
# variables de entorno que servicio-propiedades — no se inventan credenciales nuevas.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:PLACEHOLDER_SET_ENV_VAR}
  api-key: ${CLOUDINARY_API_KEY:PLACEHOLDER_SET_ENV_VAR}
  api-secret: ${CLOUDINARY_API_SECRET:PLACEHOLDER_SET_ENV_VAR}

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      servicio-usuarios:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10
      servicio-propiedades:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10
      obtenerArrendadorMsgCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      obtenerEstudianteMsgCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      obtenerPropiedadMsgCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      obtenerArrendadorMsgCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - feign.FeignException.NotFound
      obtenerEstudianteMsgCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - feign.FeignException.NotFound
      obtenerPropiedadMsgCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - feign.FeignException.NotFound
  timelimiter:
    instances:
      servicio-usuarios:
        timeoutDuration: 10s
        cancelRunningFuture: true
      servicio-propiedades:
        timeoutDuration: 10s
        cancelRunningFuture: true
      obtenerArrendadorMsgCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
      obtenerEstudianteMsgCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
      obtenerPropiedadMsgCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
  bulkhead:
    instances:
      obtenerArrendadorMsgCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms
      obtenerEstudianteMsgCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms
      obtenerPropiedadMsgCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms

jwt:
  # Sin default real: el secreto se inyecta por env (.env en dev, .env.prod en prod). Nunca en git.
  secret: ${JWT_SECRET:PLACEHOLDER_SET_ENV_VAR}
  expiration: ${JWT_EXPIRATION:7200000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

mensajeria:
  websocket:
    # Orígenes permitidos para el handshake WebSocket. Misma lista que CORS en prod.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    endpoint: /ws-mensajeria
