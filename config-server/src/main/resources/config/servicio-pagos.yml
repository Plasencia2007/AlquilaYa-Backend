spring:
  application:
    name: servicio-pagos
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB_PAGOS:alquilaya_pagos}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:oracle123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:APP_USR-6972773445273571-042223-e0045fabe17f71c927be919fa2fdd4d3-1888687462}
  public-key: ${MP_PUBLIC_KEY:APP_USR-8864dcdc-7880-4cfd-b41e-f5d5b09c5e41}
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  webhook:
    # En producción la firma HMAC del webhook es OBLIGATORIA.
    # Si el secret está vacío o la firma no coincide → 401/403 y NO se procesa.
    # Solo se relaja en perfiles dev/local (ver bloques --- abajo).
    required-signature: ${MP_WEBHOOK_REQUIRED_SIGNATURE:true}
  back-urls:
    success: ${MP_BACK_URL_SUCCESS:http://localhost:3000/pago/exito}
    failure: ${MP_BACK_URL_FAILURE:http://localhost:3000/pago/fallo}
    pending: ${MP_BACK_URL_PENDING:http://localhost:3000/pago/pendiente}
  notification-url: ${MP_NOTIFICATION_URL:https://plop-sabotage-roamer.ngrok-free.dev/api/v1/pagos/webhook}

server:
  port: 8084

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      crearPreferenciaCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Los errores de negocio (MP 4xx) no son fallo del servicio: no deben abrir el circuito.
        ignoreExceptions:
          - java.lang.IllegalStateException
      servicio-propiedades:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10
      obtenerReservaCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      crearPreferenciaCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - java.lang.RuntimeException
        # Crear preferencia NO es idempotente: los errores de negocio (MP 4xx, IDOR,
        # reserva ya pagada) se marcan como IllegalStateException y NO se reintentan.
        ignoreExceptions:
          - java.lang.IllegalStateException
      obtenerReservaCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - feign.FeignException.NotFound
  timelimiter:
    instances:
      crearPreferenciaCB:
        timeoutDuration: 8s
        cancelRunningFuture: true
      servicio-propiedades:
        timeoutDuration: 10s
        cancelRunningFuture: true
      obtenerReservaCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
  bulkhead:
    instances:
      obtenerReservaCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms
      crearPreferenciaCB:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
  ratelimiter:
    instances:
      crearPreferenciaCB:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 5s

---
spring:
  config:
    activate:
      on-profile: dev
mercadopago:
  webhook:
    required-signature: false

---
spring:
  config:
    activate:
      on-profile: local
mercadopago:
  webhook:
    required-signature: false

