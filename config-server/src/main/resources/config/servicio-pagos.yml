spring:
  application:
    name: servicio-pagos
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB_PAGOS:alquilaya_pagos}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:PLACEHOLDER_SET_ENV_VAR}
  public-key: ${MP_PUBLIC_KEY:APP_USR-8864dcdc-7880-4cfd-b41e-f5d5b09c5e41}
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  webhook:
    # En producción la firma HMAC del webhook es OBLIGATORIA.
    # Si el secret está vacío o la firma no coincide → 401/403 y NO se procesa.
    # Solo se relaja en perfiles dev/local (ver bloques --- abajo).
    required-signature: ${MP_WEBHOOK_REQUIRED_SIGNATURE:true}
  back-urls:
    success: ${MP_BACK_URL_SUCCESS:http://localhost:3000/pago/exito}
    failure: ${MP_BACK_URL_FAILURE:http://localhost:3000/pago/fallo}
    pending: ${MP_BACK_URL_PENDING:http://localhost:3000/pago/pendiente}
  notification-url: ${MP_NOTIFICATION_URL:https://plop-sabotage-roamer.ngrok-free.dev/api/v1/pagos/webhook}

server:
  port: 8084

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000 # Límite de 3 segundos para establecer conexión TCP
        readTimeout: 10000   # Límite de 10 segundos para recibir la respuesta HTTP
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      crearPreferenciaCB:
        registerHealthIndicator: true            # Registra el estado en el endpoint de salud
        slidingWindowType: COUNT_BASED           # Tipo de ventana
        slidingWindowSize: 5                     # Tamaño de la ventana
        failureRateThreshold: 50                 # Porcentaje de errores para abrir el circuito
        waitDurationInOpenState: 15s             # Tiempo en estado abierto
        permittedNumberOfCallsInHalfOpenState: 3 # Número de llamadas en estado semiabierto
        minimumNumberOfCalls: 5                  # Número mínimo de llamadas para abrir el circuito
        automaticTransitionFromOpenToHalfOpenEnabled: true # Habilita la transición automática
        # Los errores de negocio (MP 4xx) no son fallo del servicio: no deben abrir el circuito.
        ignoreExceptions:
          - java.lang.IllegalStateException
      servicio-propiedades:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10
      obtenerReservaCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      crearPreferenciaCB:
        maxAttempts: 3                  # Máximo 3 reintentos
        waitDuration: 1s                # Tiempo de espera inicial entre reintentos
        enableExponentialBackoff: true  # Habilita el reintento exponencial
        exponentialBackoffMultiplier: 2 # 1s, 2s, 4s
        retryExceptions:                # Excepciones que provocan reintento
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - java.lang.RuntimeException
        ignoreExceptions:               # Excepciones que NO provocan reintento
          - java.lang.IllegalStateException
      obtenerReservaCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - feign.FeignException.NotFound
  timelimiter:
    instances:
      crearPreferenciaCB:
        timeoutDuration: 8s       # Espera hasta 8s antes de time out
        cancelRunningFuture: true # Cancela la petición si excede el tiempo
      servicio-propiedades:
        timeoutDuration: 100ms
        cancelRunningFuture: true
      obtenerReservaCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
  bulkhead:
    instances:
      obtenerReservaCB:
        maxConcurrentCalls: 5   # Máximo 5 llamadas concurrentes
        maxWaitDuration: 100ms  # Espera hasta 100ms si están todas ocupadas
      crearPreferenciaCB:
        maxConcurrentCalls: 10  # Máximo 10 llamadas concurrentes
        maxWaitDuration: 100ms  # Espera hasta 100ms si están todas ocupadas
  ratelimiter:
    instances:
      crearPreferenciaCB:
        limitForPeriod: 10     # Máximo 10 preferencias de pago por segundo
        limitRefreshPeriod: 1s # Cada segundo
        timeoutDuration: 5s    # Espera hasta 5 segundos por un permiso

# Seguridad JWT sincronizada
jwt:
  # Sin default real: el secreto se inyecta por env (.env en dev, .env.prod en prod). Nunca en git.
  secret: ${JWT_SECRET:PLACEHOLDER_SET_ENV_VAR}
  expiration: ${JWT_EXPIRATION:7200000}

# Reconciliación con Mercado Pago (G5): re-consulta los pagos en PENDIENTE_REVISION/DISCREPANCIA
# contra MP (fuente de verdad) y concilia el estado local reusando el mismo path de eventos/outbox
# del webhook. El disparo on-demand del admin no depende de 'enabled'.
pagos:
  reconciliacion:
    enabled: ${PAGOS_RECONCILIACION_ENABLED:true}
    interval-ms: ${PAGOS_RECONCILIACION_INTERVAL_MS:900000}       # 15 min entre corridas
    initial-delay-ms: ${PAGOS_RECONCILIACION_INITIAL_DELAY_MS:60000} # espera al arranque
    batch-size: ${PAGOS_RECONCILIACION_BATCH:50}                 # máx. pagos por corrida (antiguos primero)

---
spring:
  config:
    activate:
      on-profile: dev
mercadopago:
  webhook:
    required-signature: false

---
spring:
  config:
    activate:
      on-profile: local
mercadopago:
  webhook:
    required-signature: false

---
# S7: en PROD la firma HMAC del webhook es OBLIGATORIA (secure-by-default), sin importar el
# valor de MP_WEBHOOK_REQUIRED_SIGNATURE del .env compartido (que va en false para dev, donde
# se usa /simular-exito y no el webhook real). Requisito: setear MP_WEBHOOK_SECRET (panel de MP).
# Si el secret falta, el webhook se RECHAZA con log ERROR (mejor que aceptar webhooks forjados).
# Nota: aunque la firma estuviera off, el código re-consulta el pago a MP como fuente de verdad,
# así que un webhook forjado no puede fingir un pago; esto es defensa en profundidad + anti-spam.
spring:
  config:
    activate:
      on-profile: prod
mercadopago:
  webhook:
    required-signature: true

