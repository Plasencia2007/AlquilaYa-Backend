# Configuración para servicio-usuarios
spring:
  application:
    name: servicio-usuarios
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB_USUARIOS:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: servicio-usuarios-resenas
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 0 # Puerto aleatorio para permitir múltiples instancias si fuera necesario

jwt:
  # Sin default real: el secreto se inyecta por env (.env en dev, .env.prod en prod). Nunca en git.
  secret: ${JWT_SECRET:PLACEHOLDER_SET_ENV_VAR}
  expiration: ${JWT_EXPIRATION:7200000}   # 2h por default
  # G7: refresh token de larga duración (30 días) en Redis, rotado en cada uso. Con esto ya
  # no hace falta bajar `expiration` a 1h "a mano" — el access token expira rápido, el
  # frontend lo renueva en silencio con POST /auth/refresh, y el usuario no vuelve a loguearse
  # hasta que el refresh token expire o se revoque (logout, cambio de contraseña).
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
    api-key: ${INTERNAL_API_KEY:PLACEHOLDER_SET_ENV_VAR}

# Bootstrap del primer admin en un despliegue NUEVO (solo si la BD no tiene ningún ADMIN).
# Vacío por defecto: en dev normalmente ya existe admin. En prod se setea en .env.prod.
# La contraseña se hashea en runtime; nunca se guarda en git.
admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

# Faltaba por completo (bug relacionado al de @EnableFeignClients — arreglado en
# ServicioUsuariosApplication.java): sin esto, CatalogosClient corría sin timeout/circuit
# breaker configurado, a diferencia de todos los demás servicios. Mismos valores que
# servicio-pagos.yml/servicio-propiedades.yml.
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      enviarEmailCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        minimumNumberOfCalls: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      enviarWhatsAppCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      enviarOtpCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      # Ítem 354: endpoint agregado de métricas admin (GET /api/v1/usuarios/admin/metricas) —
      # AdminMetricasAgregadoService llama a servicio-pagos y servicio-propiedades vía Feign; si
      # cualquiera de los dos está caído, su sección del response queda null en vez de tumbar el
      # endpoint completo (ver el fallbackMethod de cada uno).
      pagosResumenCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      propiedadesPendientesCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        minimumNumberOfCalls: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      enviarEmailCB:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.mail.MailException
          - jakarta.mail.MessagingException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      enviarWhatsAppCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      enviarOtpCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      pagosResumenCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      propiedadesPendientesCB:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      enviarEmailCB:
        timeoutDuration: 10s
        cancelRunningFuture: true
      enviarWhatsAppCB:
        timeoutDuration: 5s
        cancelRunningFuture: true
      enviarOtpCB:
        timeoutDuration: 5s
        cancelRunningFuture: true
      pagosResumenCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
      propiedadesPendientesCB:
        timeoutDuration: 4s
        cancelRunningFuture: true
  bulkhead:
    instances:
      enviarWhatsAppCB:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
      enviarOtpCB:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
      enviarEmailCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms
      pagosResumenCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms
      propiedadesPendientesCB:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms
  ratelimiter:
    instances:
      enviarWhatsAppCB: 
        limitForPeriod: 10 # Máximo 10 mensajes WhatsApp por segundo
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      enviarEmailCB:
        limitForPeriod: 1 # Máximo 1 email por segundo (protección contra spam)
        limitRefreshPeriod: 1s
        timeoutDuration: 5s

# Gmail SMTP para forgot-password (sin restricción de destinatarios, sin dominio propio)
# Requiere: 2FA habilitado en la cuenta + App Password de 16 chars (Google Account → Security → App passwords)
spring.mail:
  host: ${SMTP_HOST:smtp.gmail.com}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:PLACEHOLDER_SET_ENV_VAR}
  password: ${SMTP_PASSWORD:PLACEHOLDER_SET_ENV_VAR}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# OAuth Google (Identity Services)
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:PLACEHOLDER_SET_ENV_VAR}

# Cloudflare Turnstile (captcha invisible en /register)
turnstile:
  site-key: ${TURNSTILE_SITE_KEY:}
  secret-key: ${TURNSTILE_SECRET_KEY:}
  enabled: ${CAPTCHA_ENABLED:false}

# Cloudinary para almacenamiento de documentos de verificación
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:PLACEHOLDER_SET_ENV_VAR}
  api-key: ${CLOUDINARY_API_KEY:PLACEHOLDER_SET_ENV_VAR}
  api-secret: ${CLOUDINARY_API_SECRET:PLACEHOLDER_SET_ENV_VAR}

# URL pública del frontend para construir links (reset password, etc.)
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}

# Rate limit (S8): nº de proxies de confianza delante de usuarios que anexan a X-Forwarded-For.
# dev = 0 → IP del socket. prod (ngrok→nginx→gateway→usuarios) = 2 → se fija en
# docker-compose.prod.yml. usuarios sólo es accesible por red interna en prod, así que el
# vector real de spoofing externo es el gateway; esto es defensa en profundidad.
rate-limit:
  trusted-hops: ${RATE_LIMIT_TRUSTED_HOPS:0}

# Token JWT corto para reset password (15 min)
password-reset:
  token-expiration-ms: 900000

# API Peru (DNI / RUC integration)
apiperu:
  token: ${APIPERU_TOKEN:}
  url: ${APIPERU_URL:https://apiperu.dev/api}
