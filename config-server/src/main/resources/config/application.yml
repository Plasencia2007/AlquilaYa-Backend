eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

spring:
  # Redis compartido entre microservicios. Aislamiento por prefijo de key
  # (usuarios:*, gateway:*, propiedades:*, mensajeria:*, catalogos:*, pagos:*).
  # Cliente Lettuce (default Spring Boot). Standalone, NO cluster/sentinel.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Entrega confiable: ack de todos los ISR, idempotencia para no duplicar por reintentos,
      # y reintentos automáticos con backoff en caso de fallos transitorios.
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        retry.backoff.ms: 500
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: alquilaya-group
      # Default global: 'latest' (defensivo para servicios sólo-productor como pagos).
      # Consumers reales (propiedades, mensajeria, usuarios) lo sobreescriben a 'earliest'
      # en su YAML para no perder mensajes en primer arranque tras la Ola 2.
      auto-offset-reset: latest
      # Ola 2: idempotencia transaccional + commits manuales por record.
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      # commit por cada record procesado en el consumer (combinado con @Transactional + IdempotencyService)
      ack-mode: RECORD
      # Trazabilidad distribuida: crea spans en el consumo de mensajes y propaga el traceId
      # (combinado con micrometer-tracing). Permite seguir un evento Kafka entre servicios.
      observation-enabled: true
    template:
      # Propaga el traceId al publicar mensajes (lado productor).
      observation-enabled: true

server:
  # Permite completar requests en vuelo durante shutdown antes de cerrar el contexto.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,timelimiters
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  # ---- Trazabilidad distribuida (Micrometer Tracing + Zipkin) ----
  tracing:
    sampling:
      # Dev: traza el 100% de las peticiones. En produccion bajar (p.ej. 0.1).
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      # Exporta los spans al servidor Zipkin (docker-compose). Si Zipkin no corre,
      # el traceId/spanId sigue apareciendo en los logs igual.
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
