# =============================================================================
# Test-only config (T3): @SpringBootTest contextLoads OFFLINE, sin MySQL/Kafka/
# Redis/Eureka/Config-Server. Se aplica SIEMPRE en tests. NO afecta a produccion.
# =============================================================================
spring:
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
    discovery:
      enabled: false
  # H2 en memoria en modo MySQL. Hibernate crea el esquema desde las entidades
  # (create-drop), necesario porque el DataInitializer siembra el catalogo al arrancar.
  datasource:
    url: jdbc:h2:mem:catalogos;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  # Cache en memoria simple en tests (evita depender de Redis).
  cache:
    type: simple

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: test-secret-at-least-256-bits-long-for-testing-purposes-only-0123456789
  expiration: 7200000
